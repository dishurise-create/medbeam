# Visits the MedBeam community database every 3 days so the free Supabase plan
# doesn't pause it for inactivity. Read-only: it just asks for one report ID.
name: Keep database awake
on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
            "https://bvlfogttapmohgyvvyva.supabase.co/rest/v1/reports?select=id&limit=1" \
            -H "apikey: sb_publishable_dFeIfmrL2FZintNJE4yxJQ_kX7fS4GJ"
